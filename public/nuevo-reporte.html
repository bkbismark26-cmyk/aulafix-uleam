<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Nuevo reporte</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >
</head>

<body>

<header>

  <strong>
    AulaFix ULEAM
  </strong>

  <nav>

    <a href="/mis-reportes.html">
      Mis reportes
    </a>

    <a href="/nuevo-reporte.html">
      Nuevo reporte
    </a>

    <span data-user-name></span>

    <a
      href="#"
      onclick="cerrarSesion()"
    >
      Salir
    </a>

  </nav>

</header>


<div class="container">

  <div class="card">

    <h1>
      Nuevo reporte de incidencia
    </h1>

    <p class="small">
      Describe el problema con suficiente detalle para que pueda ser atendido correctamente.
    </p>


    <div id="msg"></div>


    <form id="form">

      <div class="grid">


        <div>

          <label for="titulo">
            Título
          </label>

          <input
            id="titulo"
            type="text"
            minlength="5"
            maxlength="80"
            placeholder="Ej. Proyector del aula no enciende"
            required
          >

        </div>


        <div>

          <label for="categoria">
            Categoría
          </label>

          <select
            id="categoria"
            required
          >

            <option value="">
              Selecciona una categoría
            </option>

            <option value="Equipos tecnológicos">
              Equipos tecnológicos
            </option>

            <option value="Electricidad">
              Electricidad
            </option>

            <option value="Climatización">
              Climatización
            </option>

            <option value="Mobiliario">
              Mobiliario
            </option>

            <option value="Internet/Red">
              Internet/Red
            </option>

            <option value="Limpieza">
              Limpieza
            </option>

            <option value="Infraestructura">
              Infraestructura
            </option>

            <option value="Otro">
              Otro
            </option>

          </select>

        </div>


        <div>

          <label for="prioridad">
            Prioridad sugerida
          </label>

          <select
            id="prioridad"
            required
          >

            <option value="baja">
              baja
            </option>

            <option
              value="media"
              selected
            >
              media
            </option>

            <option value="alta">
              alta
            </option>

            <option value="urgente">
              urgente
            </option>

          </select>

          <p class="small">
            Baja: 72 h · Media: 24 h · Alta: 6 h · Urgente: 2 h
          </p>

        </div>


        <div>

          <label for="facultad">
            Facultad
          </label>

          <input
            id="facultad"
            type="text"
            maxlength="100"
            placeholder="Ej. Facultad de Ciencias de la Vida y Tecnologías"
            required
          >

        </div>


        <div>

          <label for="bloque">
            Bloque
          </label>

          <input
            id="bloque"
            type="text"
            maxlength="40"
            placeholder="Ej. Bloque A"
            required
          >

        </div>


        <div>

          <label for="piso">
            Piso
          </label>

          <input
            id="piso"
            type="text"
            maxlength="20"
            placeholder="Ej. 2"
            required
          >

        </div>


        <div>

          <label for="aula">
            Aula/Laboratorio
          </label>

          <input
            id="aula"
            type="text"
            maxlength="60"
            placeholder="Ej. Laboratorio 3"
            required
          >

        </div>

      </div>


      <label for="descripcion">
        Descripción
      </label>

      <textarea
        id="descripcion"
        minlength="15"
        maxlength="1000"
        placeholder="Describe qué ocurre, desde cuándo sucede y cómo afecta el uso del aula o equipo."
        required
      ></textarea>


      <label for="foto">
        Foto inicial (opcional)
      </label>

      <input
        id="foto"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/gif"
      >

      <p class="small">
        Formatos permitidos: JPG, PNG, WEBP o GIF. Tamaño máximo: 5 MB.
      </p>


      <div
        class="actions"
        style="margin-top:16px"
      >

        <button
          id="btn"
          type="submit"
        >
          Enviar reporte
        </button>

        <a
          class="btn secondary"
          href="/mis-reportes.html"
        >
          Cancelar
        </a>

      </div>

    </form>

  </div>

</div>


<script
  src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"
></script>

<script
  src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"
></script>

<script
  src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"
></script>


<script src="/js/firebase-config.js"></script>
<script src="/js/cloudinary-config.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/db.js"></script>
<script src="/js/notifications-ui.js"></script>


<script>

function mostrarMensaje(
  texto,
  tipo = "normal"
) {

  const msg =
    document.getElementById(
      "msg"
    );


  msg.innerHTML = `

    <div class="${
      tipo === "error"
        ? "notice error"
        : "notice"
    }">

      ${texto}

    </div>

  `;
}


function validarImagen(archivo) {

  if (!archivo) {
    return true;
  }


  const tiposPermitidos = [

    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"

  ];


  if (
    !tiposPermitidos.includes(
      archivo.type
    )
  ) {

    throw new Error(
      "La imagen debe estar en formato JPG, PNG, WEBP o GIF."
    );
  }


  const maximoBytes =
    5 * 1024 * 1024;


  if (
    archivo.size >
    maximoBytes
  ) {

    throw new Error(
      "La imagen supera el tamaño máximo permitido de 5 MB."
    );
  }


  return true;
}


function validarCampos() {

  const tituloValor =
    titulo.value.trim();


  const descripcionValor =
    descripcion.value.trim();


  const facultadValor =
    facultad.value.trim();


  const bloqueValor =
    bloque.value.trim();


  const pisoValor =
    piso.value.trim();


  const aulaValor =
    aula.value.trim();


  if (
    tituloValor.length < 5
  ) {

    throw new Error(
      "El título debe tener al menos 5 caracteres."
    );
  }


  if (
    descripcionValor.length < 15
  ) {

    throw new Error(
      "La descripción debe tener al menos 15 caracteres."
    );
  }


  if (
    !categoria.value
  ) {

    throw new Error(
      "Selecciona una categoría."
    );
  }


  if (
    !facultadValor ||
    !bloqueValor ||
    !pisoValor ||
    !aulaValor
  ) {

    throw new Error(
      "Completa todos los datos de ubicación."
    );
  }


  return {

    titulo:
      tituloValor,

    descripcion:
      descripcionValor,

    facultad:
      facultadValor,

    bloque:
      bloqueValor,

    piso:
      pisoValor,

    aula:
      aulaValor

  };
}


async function iniciarPagina() {

  await inicializarNotificacionesUI();


  const form =
    document.getElementById(
      "form"
    );


  const btn =
    document.getElementById(
      "btn"
    );


  const foto =
    document.getElementById(
      "foto"
    );


  let enviando =
    false;


  form.addEventListener(

    "submit",

    async evento => {

      evento.preventDefault();


      if (enviando) {
        return;
      }


      let datosValidos;


      try {

        datosValidos =
          validarCampos();


        validarImagen(
          foto.files[0]
        );


      } catch (error) {

        mostrarMensaje(
          error.message,
          "error"
        );

        return;
      }


      enviando =
        true;


      btn.disabled =
        true;


      btn.textContent =
        "Enviando...";


      mostrarMensaje(
        "Preparando el reporte..."
      );


      try {

        let imagenURL =
          null;


        if (
          foto.files[0]
        ) {

          mostrarMensaje(
            "Subiendo evidencia fotográfica..."
          );


          imagenURL =
            await subirImagenCloudinary(
              foto.files[0]
            );
        }


        mostrarMensaje(
          "Guardando el reporte y generando el ticket..."
        );


        const reporteId =
          await crearReporte({

            titulo:
              datosValidos.titulo,

            categoria:
              categoria.value,

            prioridad:
              prioridad.value,

            descripcion:
              datosValidos.descripcion,

            ubicacion: {

              facultad:
                datosValidos.facultad,

              bloque:
                datosValidos.bloque,

              piso:
                datosValidos.piso,

              aula:
                datosValidos.aula

            },

            imagen_inicial_url:
              imagenURL,

            creado_por:
              usuarioActual.uid,

            creado_por_nombre:
              perfilActual.nombre
          });


        mostrarMensaje(
          "Reporte creado correctamente. Abriendo el detalle..."
        );


        window.location.href =
          `/reporte-detalle.html?id=${encodeURIComponent(
            reporteId
          )}`;


      } catch (error) {

        console.error(
          "Error creando reporte:",
          error
        );


        let mensaje =
          "No se pudo crear el reporte.";


        if (
          error?.code ===
          "permission-denied"
        ) {

          mensaje =
            "No tienes permisos para realizar esta operación.";
        }

        else if (
          error?.message
        ) {

          mensaje =
            error.message;
        }


        mostrarMensaje(
          mensaje,
          "error"
        );


        enviando =
          false;


        btn.disabled =
          false;


        btn.textContent =
          "Enviar reporte";
      }
    }
  );
}


protegerPagina([
  "usuario",
  "administrador"
]);

</script>

</body>

</html>
