<script>

/* =========================================================
   ID DEL REPORTE
========================================================= */

const id =
  new URLSearchParams(
    window.location.search
  ).get("id");


/* =========================================================
   ESCAPAR TEXTO
========================================================= */

function esc(valor) {

  return String(
    valor ?? ""
  ).replace(

    /[&<>"']/g,

    caracter => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    }[caracter])
  );
}


/* =========================================================
   CONVERTIR FECHA
========================================================= */

function convertirFecha(valor) {

  if (!valor) {
    return null;
  }


  if (
    typeof valor.toDate === "function"
  ) {

    return valor.toDate();
  }


  if (
    valor.seconds !== undefined
  ) {

    return new Date(
      valor.seconds * 1000
    );
  }


  const resultado =
    new Date(valor);


  if (
    Number.isNaN(
      resultado.getTime()
    )
  ) {

    return null;
  }


  return resultado;
}


/* =========================================================
   FORMATEAR FECHA
========================================================= */

function fecha(valor) {

  const resultado =
    convertirFecha(valor);


  if (!resultado) {
    return "";
  }


  return resultado.toLocaleString();
}


/* =========================================================
   OBTENER ÚLTIMA FECHA DE SOLUCIÓN
========================================================= */

function obtenerFechaResolucion(reporte) {

  const historial =
    Array.isArray(
      reporte.historial
    )
      ? reporte.historial
      : [];


  const soluciones =
    historial.filter(

      item =>
        item.estado ===
        "solucionado"
    );


  if (
    soluciones.length > 0
  ) {

    const ultimaSolucion =
      soluciones[
        soluciones.length - 1
      ];


    return convertirFecha(
      ultimaSolucion.fecha
    );
  }


  const cierres =
    historial.filter(

      item =>
        item.estado ===
        "cerrado"
    );


  if (
    cierres.length > 0
  ) {

    const ultimoCierre =
      cierres[
        cierres.length - 1
      ];


    return convertirFecha(
      ultimoCierre.fecha
    );
  }


  return null;
}


/* =========================================================
   ESTADO SLA
========================================================= */

function obtenerEstadoSLA(reporte) {

  if (!reporte.vence_en) {

    return {

      texto:
        "SIN SLA",

      clase:
        "badge"

    };
  }


  if (
    reporte.estado ===
    "rechazado"
  ) {

    return {

      texto:
        "RECHAZADO",

      clase:
        "badge"

    };
  }


  const vence =
    convertirFecha(
      reporte.vence_en
    );


  if (!vence) {

    return {

      texto:
        "SIN SLA",

      clase:
        "badge"

    };
  }


  /* =====================================================
     REPORTES SOLUCIONADOS O CERRADOS
  ===================================================== */

  if (
    reporte.estado === "solucionado" ||
    reporte.estado === "cerrado"
  ) {

    const fechaResolucion =
      obtenerFechaResolucion(
        reporte
      );


    if (!fechaResolucion) {

      return {

        texto:
          "FINALIZADO",

        clase:
          "badge"

      };
    }


    if (
      fechaResolucion <= vence
    ) {

      return {

        texto:
          "CUMPLIDO",

        clase:
          "badge priority-baja"

      };
    }


    return {

      texto:
        "FUERA DE SLA",

      clase:
        "badge priority-urgente"

    };
  }


  /* =====================================================
     REPORTES ACTIVOS
  ===================================================== */

  const ahora =
    new Date();


  const diferencia =
    vence.getTime() -
    ahora.getTime();


  if (
    diferencia <= 0
  ) {

    return {

      texto:
        "VENCIDO",

      clase:
        "badge priority-urgente"

    };
  }


  if (
    diferencia <=
    60 * 60 * 1000
  ) {

    return {

      texto:
        "PRÓXIMO A VENCER",

      clase:
        "badge priority-media"

    };
  }


  return {

    texto:
      "A TIEMPO",

    clase:
      "badge priority-baja"

  };
}


/* =========================================================
   CREAR HISTORIAL
========================================================= */

function crearHistorial(reporte) {

  const historial =
    Array.isArray(
      reporte.historial
    )
      ? reporte.historial
      : [];


  if (
    historial.length === 0
  ) {

    return `
      <p class="small">
        Sin historial.
      </p>
    `;
  }


  return historial
    .map(

      item => `

        <div class="item">

          <b>
            ${esc(
              item.estado ||
              "Sin estado"
            )}
          </b>

          <div class="small">

            ${esc(
              item.usuario ||
              "Sistema"
            )}

            ·

            ${fecha(
              item.fecha
            )}

          </div>

          ${
            item.nota

              ? `
                <div>
                  ${esc(
                    item.nota
                  )}
                </div>
              `

              : ""
          }

        </div>

      `
    )
    .join("");
}


/* =========================================================
   CREAR COMENTARIOS
========================================================= */

function crearComentarios(reporte) {

  const comentarios =
    Array.isArray(
      reporte.comentarios
    )
      ? reporte.comentarios
      : [];


  if (
    comentarios.length === 0
  ) {

    return `
      <p class="small">
        Sin comentarios.
      </p>
    `;
  }


  return comentarios
    .map(

      comentario => `

        <div class="card">

          <b>
            ${esc(
              comentario.usuario_nombre ||
              "Usuario"
            )}
          </b>

          <span class="small">

            ${
              comentario.rol

                ? `(${esc(
                    comentario.rol
                  )})`

                : ""
            }

            ·

            ${fecha(
              comentario.fecha
            )}

          </span>

          <div>
            ${esc(
              comentario.texto ||
              ""
            )}
          </div>

        </div>

      `
    )
    .join("");
}


/* =========================================================
   INICIAR PÁGINA
========================================================= */

async function iniciarPagina() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  if (!id) {

    contenido.innerHTML = `

      <div class="notice error">
        No se especificó un reporte.
      </div>

    `;

    return;
  }


  try {

    await inicializarNotificacionesUI();


    const reporte =
      await obtenerReporte(id);


    if (!reporte) {

      contenido.innerHTML = `

        <div class="notice error">
          Reporte no encontrado.
        </div>

      `;

      return;
    }


    const estadoSLA =
      obtenerEstadoSLA(
        reporte
      );


    const fechaVencimiento =
      convertirFecha(
        reporte.vence_en
      );


    const historialHTML =
      crearHistorial(
        reporte
      );


    const comentariosHTML =
      crearComentarios(
        reporte
      );


    const ubicacion =
      reporte.ubicacion || {};


    contenido.innerHTML = `

      <div class="card">

        <h1>
          ${esc(
            reporte.titulo ||
            "Reporte"
          )}
        </h1>


        <p>

          <b>
            Ticket:
          </b>

          ${esc(
            reporte.ticket ||
            "Sin ticket"
          )}

        </p>


        <p>

          <b>
            SLA:
          </b>

          ${
            reporte.sla_horas ??
            "-"
          }
          horas

        </p>


        <p>

          <b>
            Vence:
          </b>

          ${
            fechaVencimiento

              ? fechaVencimiento
                  .toLocaleString()

              : "Sin fecha"
          }

        </p>


        <p>

          <b>
            Estado SLA:
          </b>

          <span
            class="${estadoSLA.clase}"
          >
            ${esc(
              estadoSLA.texto
            )}
          </span>

        </p>


        <p>

          <span
            class="badge status"
          >
            ${esc(
              reporte.estado ||
              "Sin estado"
            )}
          </span>


          <span
            class="
              badge
              priority-${esc(
                reporte.prioridad ||
                ""
              )}
            "
          >
            ${esc(
              reporte.prioridad ||
              "Sin prioridad"
            )}
          </span>

        </p>


        <p>
          ${esc(
            reporte.descripcion ||
            ""
          )}
        </p>


        <p>

          <b>
            Categoría:
          </b>

          ${esc(
            reporte.categoria ||
            "Sin categoría"
          )}

        </p>


        <p>

          <b>
            Ubicación:
          </b>

          ${esc(
            ubicacion.facultad ||
            "-"
          )}

          ·

          ${esc(
            ubicacion.bloque ||
            "-"
          )}

          · piso

          ${esc(
            ubicacion.piso ||
            "-"
          )}

          ·

          ${esc(
            ubicacion.aula ||
            "-"
          )}

        </p>


        <p>

          <b>
            Técnico:
          </b>

          ${esc(
            reporte.tecnico_nombre ||
            "Sin asignar"
          )}

        </p>


        ${
          reporte.imagen_inicial_url

            ? `

              <div
                style="margin-top:20px"
              >

                <h3>
                  Evidencia inicial
                </h3>

                <img
                  class="preview"
                  src="${esc(
                    reporte.imagen_inicial_url
                  )}"
                  alt="Evidencia inicial del reporte"
                >

              </div>

            `

            : ""
        }


        ${
          reporte.evidencia_final_url

            ? `

              <div
                style="margin-top:20px"
              >

                <h3>
                  Evidencia final
                </h3>

                <img
                  class="preview"
                  src="${esc(
                    reporte.evidencia_final_url
                  )}"
                  alt="Evidencia final del reporte"
                >

              </div>

            `

            : ""
        }

      </div>


      <div class="grid">


        <div class="card">

          <h2>
            Historial
          </h2>

          <div class="timeline">

            ${historialHTML}

          </div>

        </div>


        <div>


          <div class="card">

            <h2>
              Comentarios
            </h2>

            ${comentariosHTML}

          </div>


          <div class="card">

            <form id="fcom">

              <label for="txt">
                Nuevo comentario
              </label>

              <textarea
                id="txt"
                required
                minlength="2"
                maxlength="1000"
                placeholder="Escribe un comentario..."
              ></textarea>


              <button
                type="submit"
              >
                Agregar
              </button>

            </form>

          </div>


        </div>


      </div>

    `;


    /* =====================================================
       FORMULARIO DE COMENTARIOS
    ===================================================== */

    const formularioComentario =
      document.getElementById(
        "fcom"
      );


    const txt =
      document.getElementById(
        "txt"
      );


    formularioComentario
      .addEventListener(

        "submit",

        async evento => {

          evento.preventDefault();


          const texto =
            txt.value.trim();


          if (
            texto.length < 2
          ) {

            alert(
              "El comentario debe tener al menos 2 caracteres."
            );

            return;
          }


          const boton =
            formularioComentario
              .querySelector(
                "button[type='submit']"
              );


          boton.disabled =
            true;


          const textoOriginal =
            boton.textContent;


          boton.textContent =
            "Guardando...";


          try {

            await agregarComentario(

              id,

              reporte,

              texto,

              {

                uid:
                  usuarioActual.uid,

                nombre:
                  perfilActual.nombre,

                rol:
                  perfilActual.rol

              }
            );


            await iniciarPagina();


          } catch (error) {

            console.error(
              "Error al agregar comentario:",
              error
            );


            alert(
              "No se pudo agregar el comentario."
            );


            boton.disabled =
              false;


            boton.textContent =
              textoOriginal;
          }
        }
      );


  } catch (error) {

    console.error(
      "Error cargando reporte:",
      error
    );


    contenido.innerHTML = `

      <div class="notice error">

        No se pudo cargar el reporte.

        <br><br>

        Intenta actualizar la página.

      </div>

    `;
  }
}


/* =========================================================
   SEGURIDAD
========================================================= */

protegerPagina([
  "usuario",
  "administrador"
]);

</script>

</body>

</html>
