<!-- FIREBASE -->

<script>

/* =========================================================
   ESCAPAR TEXTO
========================================================= */

function esc(valor) {

  return String(
    valor ?? ""
  ).replace(

    /[&<>"']/g,

    caracter => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    }[caracter])
  );
}


/* =========================================================
   CONVERTIR FECHA
========================================================= */

function convertirFecha(valor) {

  if (!valor) {
    return null;
  }


  if (
    typeof valor.toDate === "function"
  ) {

    return valor.toDate();
  }


  if (
    valor.seconds !== undefined
  ) {

    return new Date(
      valor.seconds * 1000
    );
  }


  const resultado =
    new Date(valor);


  return Number.isNaN(
    resultado.getTime()
  )
    ? null
    : resultado;
}


/* =========================================================
   FECHA DE RESOLUCIÓN
========================================================= */

function obtenerFechaResolucion(reporte) {

  const historial =
    Array.isArray(
      reporte.historial
    )
      ? reporte.historial
      : [];


  const soluciones =
    historial.filter(

      item =>
        item.estado ===
        "solucionado"
    );


  if (
    soluciones.length > 0
  ) {

    const ultimaSolucion =
      soluciones[
        soluciones.length - 1
      ];


    return convertirFecha(
      ultimaSolucion.fecha
    );
  }


  const cierres =
    historial.filter(

      item =>
        item.estado ===
        "cerrado"
    );


  if (
    cierres.length > 0
  ) {

    const ultimoCierre =
      cierres[
        cierres.length - 1
      ];


    return convertirFecha(
      ultimoCierre.fecha
    );
  }


  return null;
}


/* =========================================================
   ESTADO SLA
========================================================= */

function obtenerEstadoSLA(reporte) {

  if (!reporte.vence_en) {

    return {

      texto:
        "SIN SLA",

      clase:
        "badge"

    };
  }


  if (
    reporte.estado ===
    "rechazado"
  ) {

    return {

      texto:
        "RECHAZADO",

      clase:
        "badge"

    };
  }


  const vence =
    convertirFecha(
      reporte.vence_en
    );


  if (!vence) {

    return {

      texto:
        "SIN SLA",

      clase:
        "badge"

    };
  }


  /* =========================
     FINALIZADOS
  ========================= */

  if (
    reporte.estado === "solucionado" ||
    reporte.estado === "cerrado"
  ) {

    const resolucion =
      obtenerFechaResolucion(
        reporte
      );


    if (!resolucion) {

      return {

        texto:
          "FINALIZADO",

        clase:
          "badge"

      };
    }


    if (
      resolucion <= vence
    ) {

      return {

        texto:
          "CUMPLIDO",

        clase:
          "badge priority-baja"

      };
    }


    return {

      texto:
        "FUERA DE SLA",

      clase:
        "badge priority-urgente"

    };
  }


  /* =========================
     ACTIVOS
  ========================= */

  const diferencia =
    vence.getTime() -
    Date.now();


  if (
    diferencia <= 0
  ) {

    return {

      texto:
        "VENCIDO",

      clase:
        "badge priority-urgente"

    };
  }


  if (
    diferencia <=
    60 * 60 * 1000
  ) {

    return {

      texto:
        "PRÓXIMO A VENCER",

      clase:
        "badge priority-media"

    };
  }


  return {

    texto:
      "A TIEMPO",

    clase:
      "badge priority-baja"

  };
}


/* =========================================================
   INICIAR PÁGINA
========================================================= */

async function iniciarPagina() {

  const lista =
    document.getElementById(
      "lista"
    );


  try {

    await inicializarNotificacionesUI();


    const data =
      await listarMisReportes(
        usuarioActual.uid
      );


    /* =========================
       SIN REPORTES
    ========================= */

    if (!data.length) {

      lista.innerHTML = `

        <div class="notice">

          <strong>
            Todavía no tienes reportes registrados.
          </strong>

          <p class="small">
            Cuando encuentres una incidencia puedes crear tu primer reporte.
          </p>

          <a
            class="btn"
            href="/nuevo-reporte.html"
          >
            Crear primer reporte
          </a>

        </div>

      `;

      return;
    }


    /* =========================
       LISTA
    ========================= */

    lista.innerHTML =
      data
        .map(
          reporte => {

            const sla =
              obtenerEstadoSLA(
                reporte
              );


            const vence =
              convertirFecha(
                reporte.vence_en
              );


            return `

              <div class="card">

                <div
                  class="actions"
                  style="
                    justify-content:space-between;
                    align-items:flex-start;
                  "
                >

                  <div>

                    <h3>
                      ${esc(
                        reporte.titulo
                      )}
                    </h3>


                    <p class="small">

                      <b>
                        Ticket:
                      </b>

                      ${esc(
                        reporte.ticket ||
                        "Sin ticket"
                      )}

                    </p>


                    <p>

                      <span
                        class="badge status"
                      >
                        ${esc(
                          reporte.estado
                        )}
                      </span>


                      <span
                        class="
                          badge
                          priority-${esc(
                            reporte.prioridad
                          )}
                        "
                      >
                        ${esc(
                          reporte.prioridad
                        )}
                      </span>


                      <span
                        class="${sla.clase}"
                      >
                        ${esc(
                          sla.texto
                        )}
                      </span>

                    </p>


                    <p class="small">

                      ${esc(
                        reporte.categoria
                      )}

                      ·

                      ${esc(
                        reporte.ubicacion?.bloque ||
                        "-"
                      )}

                      /

                      ${esc(
                        reporte.ubicacion?.aula ||
                        "-"
                      )}

                    </p>


                    <p class="small">

                      <b>
                        Vence:
                      </b>

                      ${
                        vence

                          ? vence
                              .toLocaleString()

                          : "Sin fecha"
                      }

                    </p>


                    <p class="small">

                      <b>
                        Técnico:
                      </b>

                      ${esc(
                        reporte.tecnico_nombre ||
                        "Sin asignar"
                      )}

                    </p>

                  </div>


                  <a
                    class="btn"
                    href="/reporte-detalle.html?id=${encodeURIComponent(
                      reporte.id
                    )}"
                  >
                    Ver detalle
                  </a>

                </div>

              </div>

            `;
          }
        )
        .join("");


  } catch (error) {

    console.error(
      "Error cargando mis reportes:",
      error
    );


    lista.innerHTML = `

      <div class="notice error">

        <strong>
          No se pudieron cargar tus reportes.
        </strong>

        <p class="small">
          Actualiza la página e inténtalo nuevamente.
        </p>

        <button
          type="button"
          onclick="iniciarPagina()"
        >
          Reintentar
        </button>

      </div>

    `;
  }
}


/* =========================================================
   SEGURIDAD
========================================================= */

protegerPagina([
  "usuario",
  "administrador"
]);

</script>

</body>
